server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-stacktrace: never

spring:
  datasource:
    url: jdbc:h2:file:./data/ueberhol;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 123
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2

app:
  api-key: ${API_KEY:dev-key}
