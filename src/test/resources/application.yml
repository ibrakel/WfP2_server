# Test overrides — in-memory H2 so tests never fight the running server for the file lock
spring:
  datasource:
    url: jdbc:h2:mem:ueberhol-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

app:
  api-key: test-key
